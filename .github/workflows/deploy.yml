name: Deploy Frontend

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload source to server
        run: |
          rsync -az --delete \
            --exclude '.git' --exclude 'node_modules' --exclude '.next' --exclude '.env*' \
            ./ "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:legalsight-frontend/"

      - name: Build and restart container
        run: |
          ssh "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" bash -s <<'EOF'
          set -e
          cd ~/legalsight-frontend
          docker build -t legalsight-frontend:latest .
          docker rm -f legalsight-frontend 2>/dev/null || true
          docker run -d --name legalsight-frontend \
            --restart unless-stopped \
            -p 3000:3000 \
            --env-file ~/legalsight-frontend.env \
            legalsight-frontend:latest
          docker image prune -f
          EOF
